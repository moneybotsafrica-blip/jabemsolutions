/* Marketplace-style product cards: generous image stage, minimal border, compact details. */
.store-product{border-color:#e5ebe7;border-radius:.3rem;box-shadow:0 .15rem .45rem rgba(15,61,46,.05)}
.store-product:hover{border-color:#c2dccb;box-shadow:0 .8rem 1.65rem rgba(15,61,46,.13)}
.store-product-image,.store-product-placeholder{height:205px;padding:1.15rem;background:#fff;border-bottom:1px solid #eff3f0}

.hero-main::before, .hero-side::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: inherit;
    background-size: inherit;
    background-position: inherit;
    background-repeat: inherit;
    opacity: 0.3;
    z-index: -1;
}
.hero-main { background: linear-gradient(105deg,rgba(15,61,46,.98) 0%,rgba(15,61,46,.91) 48%,rgba(15,61,46,.28) 100%) !important; }
.hero-side { background: linear-gradient(135deg,rgba(20,108,67,.95),rgba(25,135,84,.78)) !important; }
.company-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    height: 100%;
    overflow: hidden;
}
.company-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.card-img-top {
    width: 100%;
    transition: transform 0.3s ease;
}
.company-card:hover .card-img-top {
    transform: scale(1.05);
}
